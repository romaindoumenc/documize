name: Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      # For tests that might need a database
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: documize_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      # Install Go dependencies
      - name: Install Go dependencies
        run: go mod download

      # Run Go tests
      - name: Run Go tests
        run: go test ./...

      # Run Go build verification
      - name: Verify Go build
        run: go build -v ./edition/community.go

      # Setup Node.js for Ember tests
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      # Install npm dependencies
      - name: Install npm dependencies
        working-directory: gui
        run: npm install

      # Run Ember tests
      - name: Run Ember tests
        working-directory: gui
        run: npm test
        env:
          CI: true

      # Run the comprehensive test script
      - name: Run comprehensive test script
        run: ./scripts/test.sh
